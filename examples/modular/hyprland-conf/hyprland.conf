# ══════════════════════════════════════════════════════════════════════════════
#  Hyprland Classic Modular Configuration (~/.config/hypr/hyprland.conf)
# ══════════════════════════════════════════════════════════════════════════════

# ── 1. Monitors ──────────────────────────────────────────────────────────────
monitor=,preferred,auto,1

# ── 2. Environment Variables ─────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*

# ── 3. Look and Feel ─────────────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(181825ee)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }
}

# ── 4. Animations ────────────────────────────────────────────────────────────
animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    animation = windows, 1, 4, easeOutQuint
    animation = layers, 1, 4, easeOutQuint
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, easeOutQuint, slide
}

# ── 5. Layouts & Input ───────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

scrolling {
    column_width = 0.89
    fullscreen_on_one_column = false
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── 6. Source Modular Configuration Files ────────────────────────────────────
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/rules.conf
source = ~/.config/hypr/conf/quickshell.conf
