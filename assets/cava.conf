## Universal CAVA configuration for Quickshell Dynamic Island
## Compatible with PulseAudio and PipeWire on all Linux distributions

[general]
bars = 12
framerate = 35
autosens = 1
overshoot = 0
lower_cutoff_freq = 40
higher_cutoff_freq = 14000

[smoothing]
monstercat = 1
waves = 1
noise_reduction = 70

[eq]
1 = 1.0
2 = 1.1
3 = 1.3
4 = 1.5
5 = 1.7
6 = 2.0

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
